[workspace]
resolver = "2"
members = [
  "crates/starroom-core",
  "crates/starroom-color",
  "crates/starroom-advisor",
  "crates/starroom-portrait",
  "crates/starroom-project",
  "crates/starroom-render",
  "crates/starroom-detail",
  "crates/starroom-geometry",
  "crates/starroom-optics",
  "src-tauri",
]
default-members = [
  "crates/starroom-core",
  "crates/starroom-color",
  "crates/starroom-advisor",
  "crates/starroom-portrait",
  "crates/starroom-project",
  "crates/starroom-render",
  "crates/starroom-detail",
  "crates/starroom-geometry",
  "crates/starroom-optics",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
